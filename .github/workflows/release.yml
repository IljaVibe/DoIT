name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies and Electron
        run: npm ci
      - name: Test SQLite and data validation
        run: npm test
      - name: Build interface
        run: npm run build
      - name: Install test browser
        run: npm exec -- playwright-core install chromium
      - name: Test interface
        run: npm run test:ui
      - name: Package Windows application
        run: npm run dist:win
      - name: Test packaged Windows application
        env:
          DOIT_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\DoIT.exe
        run: npm run test:desktop
      - name: Test accounts, themes and desktop widgets
        env:
          DOIT_EXECUTABLE: ${{ github.workspace }}\release\win-unpacked\DoIT.exe
        run: npm run test:accounts
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release/DoIT-Setup-*-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Keep Windows downloads
        uses: actions/upload-artifact@v4
        with:
          name: DoIT-Windows-x64
          path: |
            release/DoIT-Setup-*-x64.exe
            release/DoIT-Setup-*-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release/DoIT-Setup-*-x64.exe, release/DoIT-Setup-*-x64.exe.sha256 | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "DoIT $env:GITHUB_REF_NAME - Windows" --notes-file resources/RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
